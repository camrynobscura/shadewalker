name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server-tests:
    name: Server tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest

  frontend-checks:
    name: Frontend lint, build, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit

  frontend-e2e:
    name: Frontend e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Playwright's webServer boots `uv run uvicorn` itself (see
      # web/playwright.config.ts), so this job needs the Python side set
      # up too, not just Node.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npx playwright install --with-deps chromium webkit
      - working-directory: web
        run: npm run test:e2e
      # Burn-in: on a PR, the test files it changed run 10 more times, so a
      # test that fails 1 run in 3 on these machines fails here, before it
      # merges.
      # --only-changed diffs against the base branch's tip; the checkout is
      # shallow, so fetch that one commit.
      - if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin +refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}
      - if: github.event_name == 'pull_request'
        working-directory: web
        run: npx playwright test --only-changed=origin/${{ github.base_ref }} --repeat-each=10 --pass-with-no-tests
      # Every failed test's trace (web/playwright.config.ts keeps them in
      # CI): download this, then `npx playwright show-trace <zip>` or drop
      # the zip on trace.playwright.dev.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 14
