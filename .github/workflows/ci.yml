name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job only reads the repository.
permissions:
  contents: read

jobs:
  server-tests:
    name: Server tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest

  frontend-checks:
    name: Frontend lint, build, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit

  frontend-e2e:
    name: Frontend e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Playwright's webServer boots `uv run uvicorn` itself (see
      # web/playwright.config.ts), so this job needs the Python side set
      # up too, not just Node.
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npx playwright install --with-deps chromium webkit
      - working-directory: web
        run: npm run test:e2e
      # Every failed test's trace (web/playwright.config.ts keeps them in
      # CI): download this, then `npx playwright show-trace <zip>` or drop
      # the zip on trace.playwright.dev.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-traces
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Burn-in: on a PR, the spec files it changed run 10 more times, so a
  # test that fails 1 run in 3 on these machines fails here rather than
  # after the merge. Its own job so it starts alongside the e2e job
  # instead of after it, and split across four runners so ten repeats
  # cost about two plain runs. Advisory: a red here names a flaky test
  # without holding the merge, as long as it is not listed as a required
  # check in the repo's branch-protection settings. --only-changed diffs
  # against the base branch's tip and counts a comment-only edit as a
  # change, so a sweep over every spec pays full price.
  frontend-e2e-burn-in:
    name: Frontend e2e burn-in (shard ${{ matrix.shard }} of 4)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npx playwright install --with-deps chromium webkit
      # The checkout is shallow, so fetch the base branch's tip to diff against.
      - run: git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
      - working-directory: web
        run: npx playwright test --only-changed="origin/$BASE_REF" --repeat-each=10 --shard=${{ matrix.shard }}/4 --pass-with-no-tests
        env:
          BASE_REF: ${{ github.base_ref }}
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-traces-burn-in-${{ matrix.shard }}
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 14
