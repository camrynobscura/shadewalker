name: Monthly refresh reminder

# The data refresh is a laptop ritual (trees + buildings + OSM re-pin ->
# build -> deploy) that nothing automates, so nothing would notice it being
# forgotten. This opens one issue on the 1st of each month with the
# steps; closing it is the record that it happened. It does no work
# itself and touches nothing but the issue tracker.
#
# Known limit: GitHub disables scheduled workflows in a public repo after
# 60 days without a commit. Merging the weekly Dependabot PRs keeps the
# repo active; a "workflow disabled" email from GitHub is the fallback
# nudge if even that lapses.

on:
  schedule:
    - cron: '0 13 1 * *' # 1st of the month, 13:00 UTC (morning in New York)
  workflow_dispatch: # manual run, to test it or to re-open a missed month

permissions:
  issues: write

jobs:
  open-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Open the reminder issue (skipped if last month's is still open)
        run: |
          set -euo pipefail
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search 'Monthly refresh due in:title' --json number --jq 'length')
          if [ "$open" != "0" ]; then
            echo "An open 'Monthly refresh due' issue already exists; not opening another."
            exit 0
          fi
          month=$(date -u +'%B %Y')
          cat > "$RUNNER_TEMP/body.md" <<'EOF'
          Monthly data refresh for shadewalker.nyc: re-pin OSM, re-fetch the trees and the building footprints, rebuild the export, redeploy. The site keeps working without it; the data just ages (trees update upstream every two weeks, building footprints daily, ~1-2% of NYC's pedestrian ways change per month).

          On the laptop, from the repo root:

          1. **Re-pin OSM** (~500 MB):
             `curl -o data/oracle/new-york-latest.osm.pbf https://download.geofabrik.de/north-america/us/new-york-latest.osm.pbf`
             then write today's date into `data/oracle/new-york-latest.timestamp.txt`.
          2. **Bust the tree and building caches** so the build re-fetches them (~8 min + ~7 min):
             `rm data/raw/socrata/trees_citywide_v3.json data/raw/socrata/buildings_v1.json.gz`
          3. **Build** (~5 h: ~17 min for graph and trees, ~4.5 h for building shadows, measured 2026-09-25 — start it with `caffeinate -i` and let it run; writes `data/export/` over whatever a local server is serving):
             `caffeinate -i uv run python -m pipeline.build`
             Watch the edge/naming/canopy/buildings/shadows tally lines against the previous run's.
          4. **Ship** (deploy/README.md §5): `(cd web && npm run build)` only if the frontend changed since the last deploy, then `./deploy/smoke_test.sh`, then `HOST=deploy@<droplet-ip> ./deploy/deploy.sh`, then `curl -sS https://shadewalker.nyc/health`.

          Close this issue once the live site is serving the new export.
          EOF
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Monthly refresh due: $month" \
            --body-file "$RUNNER_TEMP/body.md"
