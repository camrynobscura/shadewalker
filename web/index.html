<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Map tiles come from this CDN the moment Leaflet mounts; opening the
         connection early shaves the TLS handshake off first paint. -->
    <link rel="preconnect" href="https://a.basemaps.cartocdn.com" crossorigin />
    <link rel="preconnect" href="https://b.basemaps.cartocdn.com" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Find the shadiest walking route in NYC, powered by the live NYC Tree Map."
    />
    <meta name="theme-color" content="#e6f2e9" />
    <!-- www redirects to the apex (deploy/Caddyfile), so the apex URL is
         the one canonical address for crawlers and link previews alike. -->
    <link rel="canonical" href="https://shadewalker.nyc/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://shadewalker.nyc/" />
    <meta property="og:title" content="Shade Walker — find the shadiest walking route in NYC" />
    <meta
      property="og:description"
      content="Find the shadiest walking route in NYC, powered by the live NYC Tree Map."
    />
    <meta property="og:image" content="https://shadewalker.nyc/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Shade Walker's map of Greenwich Village comparing the shadiest walking route (solid green) with the fastest (dashed pink), with the walk's shade stats beside it."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Shade Walker — find the shadiest walking route in NYC</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Cloudflare Web Analytics -->
    <script
      type="module"
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "87f8464254ec4905922eec18994f91d4"}'
    ></script>
    <!-- End Cloudflare Web Analytics -->
  </body>
</html>
