[project]
name = "shady-stroll"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0",
    "geopandas>=1.1.4",
    "numpy>=2.5.1",
    "osmnx>=2.1.0",
    "python-igraph>=1.0.0",
    "requests>=2.34.2",
    "scipy>=1.18.0",
    "shapely>=2.1.2",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "folium>=0.20.0",
    "httpx2>=2.5.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so `import server`/`import pipeline` resolve from the repo root
