[project]
name = "shadewalker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0",
    "geopandas>=1.1.4",
    "numpy>=2.5.1",
    "osmnx>=2.1.0",
    "python-igraph>=1.0.0",
    "rasterio>=1.5.0",
    "requests>=2.34.2",
    "scipy>=1.18.0",
    "shapely>=2.1.2",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "folium>=0.20.0",
    "httpx2>=2.5.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so `import server`/`import pipeline` resolve from the repo root
markers = [
    # The citywide shade-monotonicity sweep. Runs by default WHEN the real
    # data/tiles/ citywide data is present (it skips otherwise -- CI and a
    # fresh clone only have the committed pilot fixture). Opt out of the
    # ~15s graph load in a tight edit-test loop with: pytest -m "not citywide".
    "citywide: opt-out-able sweep over the full citywide graph (skips if data absent)",
    # The external-engine discovery harness: LIVE third-party routing-engine
    # calls, so it never runs by default or in CI. The marker alone doesn't
    # enable it -- conftest.py also requires the explicit --run-external flag.
    "external: opt-in live comparison against external routing engines (needs --run-external)",
]
